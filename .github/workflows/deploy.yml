### Build and deploy to GitHub Pages on code changes and on demand.
#
# Data refreshes are deployed by daily-refresh.yml itself (its `deploy` job), so this
# workflow ignores src/data/** and data/cache/** to avoid a double deploy.

name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "!src/data/**"
      - "public/**"
      - "astro.config.mjs"
      - "config/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate event data
        run: npm run validate

      - name: Build site
        run: npm run build

      - name: Package site for Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
